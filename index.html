<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>+EV Сигнали</title><meta name="description" content="Днешните прогнози с шанс от 70% нагоре и крайните резултати."><link rel="icon" href="favicon.png"><meta name="color-scheme" content="light dark">
<style>:root{--bg:#f3f7f5;--card:#fff;--tx:#14231c;--mut:#5d6f66;--ln:#dfe8e3;--win:#14823f;--loss:#c62f2f}
@media (prefers-color-scheme:dark){:root{--bg:#0f1714;--card:#18231e;--tx:#edf4f0;--mut:#9fb1a8;--ln:#2a3932;--win:#55cf85;--loss:#ff7b7b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:linear-gradient(120deg,#0b3d2b,#0f8a5f);color:#fff;padding:16px}header>div,main{max-width:680px;margin:auto}header b{font-size:21px}header p{margin:2px 0 0;font-size:14px;opacity:.9}
main{padding:16px}ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}.c{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;border-left:5px solid var(--ln)}.c.win{border-left-color:var(--win)}.c.loss{border-left-color:var(--loss)}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-bottom:10px}.g{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}.t{display:flex;align-items:center;gap:8px;min-width:0}.t b{font-size:15px;overflow-wrap:anywhere}.t.r{justify-content:flex-end;text-align:right}.t img,.no{width:32px;height:32px;flex:none;object-fit:contain}.no{display:grid;place-items:center;border-radius:50%;background:var(--ln);font-weight:700}
.s{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}.b{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;padding-top:10px;border-top:1px solid var(--ln);font-weight:600}.b small{display:block;color:var(--mut);font-weight:400;font-size:13px}.m{white-space:nowrap}.win .m{color:var(--win)}.loss .m{color:var(--loss)}.none{color:var(--mut)}
footer{max-width:680px;margin:auto;padding:0 16px 24px;color:var(--mut);font-size:13px}footer a{color:inherit}</style></head>
<body><header><div><b>+EV Сигнали</b><p>Прогнози за днес, 02.11.2026</p></div></header><main><p class='none'>Днес още няма прогнози с шанс от 70% нагоре.</p></main><footer>Шансът е пазарна оценка и не е гаранция. Само информация, не е съвет за залагане. 18+ · <a href="privacy.html">Поверителност</a></footer></body></html>

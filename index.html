<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>+EV Сигнали</title><meta name="description" content="Днешните прогнози на нашия модел с шанс от 70% нагоре и крайните резултати."><link rel="icon" href="favicon.png"><meta name="color-scheme" content="light dark">
<style>:root{--bg:#f3f7f5;--card:#fff;--tx:#14231c;--mut:#5d6f66;--ln:#dfe8e3;--alt:#f8fbf9;--win:#14823f;--loss:#c62f2f}
@media (prefers-color-scheme:dark){:root{--bg:#0f1714;--card:#18231e;--tx:#edf4f0;--mut:#9fb1a8;--ln:#2a3932;--alt:#1d2a24;--win:#55cf85;--loss:#ff7b7b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:linear-gradient(120deg,#0b3d2b,#0f8a5f);color:#fff;padding:16px}header>div,main{max-width:980px;margin:auto}header b{font-size:21px}header p{margin:2px 0 0;font-size:14px;opacity:.9}
main{padding:16px}ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--ln);border-radius:12px;overflow:hidden}
.r{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.5fr) 56px 62px 74px 100px;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--ln)}.r:nth-child(odd){background:var(--alt)}.hd{border-top:0;color:var(--mut);font-size:13px;font-weight:600}.hd.r{background:var(--card)}
.tm{display:flex;align-items:center;gap:8px;min-width:0;line-height:1.5}.tm b{font-size:15px;overflow-wrap:anywhere}.tm img,.no{width:22px;height:22px;flex:none;object-fit:contain}.no{display:grid;place-items:center;border-radius:50%;background:var(--ln);font-size:12px;font-weight:700}
small{display:block;color:var(--mut);font-size:12px;font-weight:400}.mt small{margin-top:3px}.pk b{font-size:15px}.n{text-align:center;font-variant-numeric:tabular-nums}.ch{font-weight:800;color:var(--win)}.sc{font-weight:800;font-size:17px}.m{white-space:nowrap;font-size:14px;font-weight:600}.win .m{color:var(--win)}.loss .m{color:var(--loss)}.none{color:var(--mut)}
@media (max-width:640px){.hd{display:none}.r{grid-template-columns:repeat(3,1fr);padding:12px 14px}.mt,.pk,.m{grid-column:1/-1}.m{text-align:left}.n[data-l]::before{content:attr(data-l);display:block;color:var(--mut);font-size:12px;font-weight:400}.m,.pk{order:1}}
footer{max-width:980px;margin:auto;padding:0 16px 24px;color:var(--mut);font-size:13px}footer a{color:inherit}</style></head>
<body><header><div><b>+EV Сигнали</b><p>Нашият модел · прогнози за днес, 02.11.2026</p></div></header><main><p class='none'>Днес нашият модел още няма прогнози с шанс от 70% нагоре.</p></main><footer>Шансът е пазарна оценка и не е гаранция. Само информация, не е съвет за залагане. 18+ · <a href="privacy.html">Поверителност</a></footer></body></html>
